[project]
name = "timotion-tc15s-ble"
version = "0.1.0"
description = "TiMOTION TC15S standing desk BLE controller"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
setup = ["bleak>=0.21"]

[project.scripts]
desk-server = "desk_server:main"
